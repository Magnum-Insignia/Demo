# 100 network endpoints as pods, all on busybox (small, has wget/nc/nslookup).
#
#  - benign  (90 replicas): each pod serves on :8080 and, on a loop, fetches a
#    handful of sibling pods and does a DNS lookup. Normal east-west chatter:
#    low fan-out, steady rate, mixed destinations.
#  - victim  (5 replicas): plain servers on :21/:22/:80, the brute-force targets.
#  - malicious (10 replicas): each picks a victim and hammers it — a fast port
#    sweep across 1-1024 then a tight connect loop on 22/21. High fan-out to a
#    single dst, then high connection rate to one port. That is the signature
#    the detector keys on.
apiVersion: v1
kind: Namespace
metadata:
  name: netsim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benign
  namespace: netsim
  labels: { tier: benign }
spec:
  replicas: 90
  selector: { matchLabels: { role: benign } }
  template:
    metadata:
      labels: { role: benign, tier: benign }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: node
          image: busybox:1.36
          resources:
            requests: { cpu: "2m", memory: "8Mi" }
            limits:   { cpu: "20m", memory: "24Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              # Real east-west chatter with a NATURAL rhythm, so the aggregate
              # telemetry breathes instead of sitting on a dead-flat line:
              #  - each pod picks a personality (chatty / normal / quiet) at start,
              #    so per-pod rates differ several-fold.
              #  - every pod rides a shared wall-clock rhythm (busy minutes and
              #    calm minutes), which correlates the fleet so the network-wide
              #    volume rises and falls in waves like a real office does.
              #  - pods occasionally go idle for a spell (a break in their traffic).
              httpd -p 8080 -h /tmp 2>/dev/null
              echo ok > /tmp/index.html
              P=$(( RANDOM % 3 ))                 # 0 chatty, 1 normal, 2 quiet
              case $P in 0) BASE=6;; 1) BASE=3;; *) BASE=1;; esac
              while true; do
                # shared rhythm: a slow wave over ~2 min, same phase for all pods
                M=$(( $(date +%s) / 20 % 6 ))     # 0..5 bucket, ~2 min cycle
                case $M in 0|1) WAVE=3;; 2|5) WAVE=1;; *) WAVE=0;; esac
                # occasional idle break (~1 in 12 cycles)
                if [ $(( RANDOM % 12 )) -eq 0 ]; then sleep $(( (RANDOM % 15) + 8 )); continue; fi
                REQ=$(( BASE + WAVE + (RANDOM % 3) ))
                n=0
                while [ $n -lt $REQ ]; do
                  wget -q -T 2 -O /dev/null "http://benign.netsim.svc.cluster.local:8080/" 2>/dev/null
                  nslookup benign.netsim.svc.cluster.local >/dev/null 2>&1
                  n=$((n+1))
                done
                sleep $(( (RANDOM % 5) + 2 ))
              done
---
apiVersion: v1
kind: Service
metadata:
  name: benign
  namespace: netsim
spec:
  selector: { role: benign }
  clusterIP: None
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim
  namespace: netsim
  labels: { tier: victim }
spec:
  replicas: 5
  selector: { matchLabels: { role: victim } }
  template:
    metadata:
      labels: { role: victim, tier: victim }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: node
          image: busybox:1.36
          resources:
            requests: { cpu: "2m", memory: "8Mi" }
            limits:   { cpu: "30m", memory: "32Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo ok > /tmp/index.html
              # a few listeners so a port sweep sees open ports
              httpd -p 80 -h /tmp 2>/dev/null
              nc -lk -p 21 -e /bin/echo "220 ftp" 2>/dev/null &
              nc -lk -p 22 -e /bin/echo "SSH-2.0"  2>/dev/null &
              while true; do sleep 30; done
---
apiVersion: v1
kind: Service
metadata:
  name: victim
  namespace: netsim
spec:
  selector: { role: victim }
  clusterIP: None
  ports:
    - { name: ftp,  port: 21, targetPort: 21 }
    - { name: ssh,  port: 22, targetPort: 22 }
    - { name: http, port: 80, targetPort: 80 }
